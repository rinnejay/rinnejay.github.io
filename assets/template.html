<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITLE}} — Dokumentasi Kopi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="{{CSS_PATH}}assets/style.css">
</head>
<body>
    <div class="layout">
        <!-- Sidebar -->
        <nav class="sidebar" id="sidebar">
            <div class="brand">
                <div class="brand-logo">K</div>
                <span class="brand-name">Kopi</span>
                <span class="brand-version">{{VERSION}}</span>
            </div>
            {{NAV}}
        </nav>

        <!-- Main -->
        <main class="content">
            <div class="topbar">
                <div class="topbar-breadcrumb">
                    <a href="{{ROOT}}index.html">Dokumentasi</a>
                    <span class="sep">/</span>
                    {{BREADCRUMB}}
                </div>
                <div class="topbar-actions">
                    <div class="search-box">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
                        <input type="text" placeholder="Cari dokumentasi..." id="searchInput">
                    </div>
                </div>
            </div>

            <div class="content-inner">
                <h1>{{TITLE}}</h1>
                <div class="doc-meta">
                    <span class="meta-pill version">{{VERSION}}</span>
                    <span class="meta-pill category">{{CATEGORY}}</span>
                    <span class="meta-pill status">{{STATUS}}</span>
                </div>
                {{CONTENT}}
                <div class="pagination">
                    {{PREV}} {{NEXT}}
                </div>
            </div>
        </main>

        <!-- TOC -->
        <aside class="toc" id="toc">
            <div class="toc-title">On this page</div>
            {{TOC}}
        </aside>

        <!-- Mobile menu toggle -->
        <button class="menu-toggle" id="menuToggle">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
    </div>

    <script>
        // Mobile menu
        const menuToggle = document.getElementById('menuToggle');
        const sidebar = document.getElementById('sidebar');
        if (menuToggle) {
            menuToggle.addEventListener('click', () => sidebar.classList.toggle('open'));
            document.addEventListener('click', (e) => {
                if (!sidebar.contains(e.target) && !menuToggle.contains(e.target))
                    sidebar.classList.remove('open');
            });
        }

        // Copy code buttons
        document.querySelectorAll('.code-copy').forEach(btn => {
            btn.addEventListener('click', () => {
                const pre = btn.closest('.code-block').querySelector('pre');
                navigator.clipboard.writeText(pre.textContent).then(() => {
                    btn.classList.add('copied');
                    btn.querySelector('span').textContent = 'Tersalin';
                    setTimeout(() => {
                        btn.classList.remove('copied');
                        btn.querySelector('span').textContent = 'Salin';
                    }, 2000);
                });
            });
        });

        // Tabs
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const group = btn.closest('.tabs');
                group.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                group.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
                btn.classList.add('active');
                group.querySelector(btn.dataset.target).classList.add('active');
            });
        });

        // TOC active state
        const tocLinks = document.querySelectorAll('.toc a');
        const headings = [];
        tocLinks.forEach(a => {
            const id = a.getAttribute('href').slice(1);
            const h = document.getElementById(id);
            if (h) headings.push([h, a]);
        });
        if (headings.length) {
            const obs = new IntersectionObserver(entries => {
                entries.forEach(e => {
                    if (e.isIntersecting) {
                        tocLinks.forEach(a => a.classList.remove('active'));
                        const link = headings.find(([h]) => h === e.target)?.[1];
                        if (link) link.classList.add('active');
                    }
                });
            }, { rootMargin: '-80px 0px -70% 0px' });
            headings.forEach(([h]) => obs.observe(h));
        }

        // Search (client-side filter)
        const searchInput = document.getElementById('searchInput');
        if (searchInput) {
            searchInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && searchInput.value.trim()) {
                    // Navigate to search page with query
                    window.location.href = '{{ROOT}}search.html?q=' + encodeURIComponent(searchInput.value.trim());
                }
            });
        }
    </script>
</body>
</html>
